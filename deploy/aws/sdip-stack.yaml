AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  System Design Interview Platform on a single EC2 instance. Caddy terminates
  TLS and reverse-proxies to the app container; PostgreSQL runs alongside it in
  Docker Compose. Deliberately one instance and one app container: WebSocket
  connections live in the app's process memory, so a second replica would split
  interview rooms.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Site
        Parameters:
          - DomainName
          - TlsEmail
      - Label:
          default: Source
        Parameters:
          - RepoUrl
          - RepoRef
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - BuildxVersion
          - RootVolumeSize
          - LatestAmiId
      - Label:
          default: CloudFront custom domain (optional - leave empty for the free *.cloudfront.net domain)
        Parameters:
          - CloudFrontDomainName
          - CloudFrontCertificateArn
          - CloudFrontHostedZoneId
      - Label:
          default: Continuous deployment (optional - leave empty to deploy by hand)
        Parameters:
          - GitHubRepository
          - GitHubEnvironment
          - GitHubSubjectPrefix
          - CreateGitHubOidcProvider
      - Label:
          default: Break-glass SSH (optional - Session Manager works without it)
        Parameters:
          - KeyName
          - SshCidr

Parameters:
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Domain to serve the app on, e.g. interviews.example.com. Point its DNS A
      record at this stack's ElasticIp output - Caddy cannot get a certificate
      until that resolves. Leave empty to serve plain HTTP instead, which is the
      right choice only when EnableCloudFront is true and CloudFront terminates
      TLS on its own domain.
    AllowedPattern: ^$|^[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,}$
    ConstraintDescription: must be empty or a fully qualified domain name

  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Put a CloudFront distribution in front of the instance and serve HTTPS on
      its free *.cloudfront.net domain. Use this when you have no domain of your
      own. Port 80 is then reachable only from CloudFront, so the origin stops
      answering the public internet directly.

  CloudFrontDomainName:
    Type: String
    Default: ""
    Description: >-
      Alternate domain name (CNAME) for the CloudFront distribution, e.g.
      interviews.example.com. Requires an ACM certificate for this exact name
      in us-east-1 (CloudFrontCertificateArn) - CloudFront only accepts
      certificates from that region, regardless of where this stack itself is
      deployed. Only used when EnableCloudFront is true; leave empty to serve
      the free *.cloudfront.net domain instead.
    AllowedPattern: ^$|^[a-zA-Z0-9][a-zA-Z0-9.-]*\.[a-zA-Z]{2,}$
    ConstraintDescription: must be empty or a fully qualified domain name

  CloudFrontCertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate ARN covering CloudFrontDomainName, issued in us-east-1.
      Required when CloudFrontDomainName is set. Deploy
      deploy/aws/sdip-domain.yaml in us-east-1 first to get one.

  CloudFrontHostedZoneId:
    Type: String
    Default: ""
    Description: >-
      Route53 hosted zone that owns CloudFrontDomainName. When set, the stack
      creates the alias record for you; leave empty to point DNS at the
      CloudFrontUrl output by hand instead.

  CloudFrontPrefixListId:
    Type: String
    Default: pl-4fa04526
    Description: >-
      The com.amazonaws.global.cloudfront.origin-facing managed prefix list,
      used to restrict port 80 to CloudFront. This ID is REGION SPECIFIC; the
      default is eu-west-1. Find yours with: aws ec2
      describe-managed-prefix-lists --filters
      Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing

  TlsEmail:
    Type: String
    Description: Email address Let's Encrypt sends certificate expiry warnings to.
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: must be an email address

  RepoUrl:
    Type: String
    Default: https://github.com/alexeygrigorev/interview-canvas-share.git
    Description: >-
      Git URL cloned on boot. Must be reachable without credentials - the
      instance has none, so a private repo needs a deploy key added by hand.

  RepoRef:
    Type: String
    Default: main
    Description: Branch or tag to deploy.

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues:
      - t4g.small
      - t4g.medium
      - t4g.large
    Description: >-
      Graviton (arm64) types only, matching the default AMI. t4g.small is
      enough to build and run the stack. To use x86, change LatestAmiId to the
      al2023-ami-kernel-default-x86_64 path as well - a mismatch fails to boot.

  RootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 12
    Description: >-
      Root EBS volume size in GiB. Holds the OS, the Docker build cache, the
      images, and the PostgreSQL data volume.

  BuildxVersion:
    Type: String
    Default: v0.36.1
    AllowedPattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
    Description: >-
      Docker buildx plugin release to install. Amazon Linux 2023 ships no
      buildx, and Compose will not build an image without 0.17 or later.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Resolved from the SSM public parameter, so stack updates track the current Amazon Linux 2023 AMI.

  GitHubRepository:
    Type: String
    Default: ""
    Description: >-
      owner/repo allowed to deploy to this instance from GitHub Actions, e.g.
      alexeygrigorev/interview-canvas-share. Leave empty to create no deploy
      role at all and keep shipping by hand.
    AllowedPattern: ^$|^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$
    ConstraintDescription: must be empty or owner/repo

  GitHubEnvironment:
    Type: String
    Default: production
    Description: >-
      The GitHub environment the deploy job runs in. It must match the
      workflow's `environment:` exactly: the OIDC token's subject claim names
      the environment, not the branch, whenever a job declares one.
    MinLength: 1

  GitHubSubjectPrefix:
    Type: String
    Default: ""
    Description: >-
      Overrides the "repo:owner/repo" prefix of the OIDC subject claim. Some
      repositories mint immutable subjects carrying numeric IDs instead
      (repo:owner@875246/repo@1321814459), which no amount of renaming or
      re-creating can spoof. Read yours with `gh api
      repos/OWNER/REPO/actions/oidc/customization/sub` and paste
      sub_claim_prefix here when it is not the plain owner/repo form -
      otherwise the role refuses every deploy with "Not authorized to perform
      sts:AssumeRoleWithWebIdentity".

  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      The GitHub OIDC provider is account-wide, so exactly one stack may own
      it. Set false if this account already has one - the role then trusts the
      existing provider instead of failing with EntityAlreadyExists.

  KeyName:
    Type: String
    Default: ""
    Description: >-
      EC2 key pair name for SSH. Leave empty to manage the box exclusively
      through Session Manager, which needs no open port and no key.

  SshCidr:
    Type: String
    Default: ""
    Description: >-
      CIDR allowed to reach port 22, e.g. 203.0.113.4/32. Leave empty to open
      no SSH ingress at all. Do not set 0.0.0.0/0.
    AllowedPattern: ^$|^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
    ConstraintDescription: must be empty or a valid IPv4 CIDR

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  EnableSsh: !Not [!Equals [!Ref SshCidr, ""]]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  UseCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  DirectHttpAccess: !Not [!Equals [!Ref EnableCloudFront, "true"]]
  UseCloudFrontDomain: !And
    - !Condition UseCloudFront
    - !Not [!Equals [!Ref CloudFrontDomainName, ""]]
  CreateCloudFrontAliasRecord: !And
    - !Condition UseCloudFrontDomain
    - !Not [!Equals [!Ref CloudFrontHostedZoneId, ""]]
  # us-east-1 predates the regional naming scheme for EC2 public DNS names.
  IsUsEast1: !Equals [!Ref "AWS::Region", us-east-1]
  HasGitHubRepo: !Not [!Equals [!Ref GitHubRepository, ""]]
  HasSubjectPrefix: !Not [!Equals [!Ref GitHubSubjectPrefix, ""]]
  CreateOidcProvider: !And
    - !Not [!Equals [!Ref GitHubRepository, ""]]
    - !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} public HTTP/HTTPS to Caddy
      VpcId: !Ref Vpc
      # Port 80 is granted below, conditionally: to the world when Caddy serves
      # traffic directly, or to CloudFront only when it fronts the origin. 443 is
      # used by Caddy in domain mode and simply goes unused otherwise.
      SecurityGroupIngress:
        - Description: HTTPS and WebSockets
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP/3
          IpProtocol: udp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sg

  HttpIngressPublic:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: DirectHttpAccess
    Properties:
      GroupId: !Ref SecurityGroup
      Description: HTTP for the HTTPS redirect and ACME challenges
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0

  HttpIngressCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: UseCloudFront
    Properties:
      GroupId: !Ref SecurityGroup
      Description: HTTP from CloudFront edge locations only
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontPrefixListId

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: EnableSsh
    Properties:
      GroupId: !Ref SecurityGroup
      Description: SSH break-glass access
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshCidr

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Grants shell access through Session Manager, so the stack needs no
        # inbound SSH and no key pair.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # The deployment procedure lives here, in the template, rather than in the
  # workflow that triggers it. That is what keeps the CI role harmless: it may
  # run this document and nothing else, so the worst a stolen GitHub token can
  # do is redeploy some commit of this repository. Granting SendCommand on
  # AWS-RunShellScript instead would hand out root on the instance.
  DeployDocument:
    Type: AWS::SSM::Document
    Condition: HasGitHubRepo
    Properties:
      Name: !Sub ${AWS::StackName}-deploy
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Roll the checkout in /opt/sdip forward to a commit and rebuild.
        parameters:
          commit:
            type: String
            description: Commit SHA to deploy.
            # SSM rejects a parameter that does not match, so the only value
            # the workflow injects into the script cannot carry shell syntax.
            allowedPattern: ^[0-9a-fA-F]{7,40}$
        mainSteps:
          - action: aws:runShellScript
            name: deploy
            inputs:
              timeoutSeconds: "1800"
              runCommand:
                - set -euo pipefail
                - cd /opt/sdip
                - git fetch --all --tags --prune
                - git checkout --detach '{{ commit }}'
                - docker compose -f docker-compose.prod.yaml up -d --build
                - docker image prune -f

  # Account-wide, so only one stack in the account may create it.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # IAM no longer validates against this for the GitHub provider, but the
        # API still wants a well-formed value.
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubRepo
    Properties:
      Description: !Sub Lets ${GitHubRepository} redeploy ${AWS::StackName} through Systems Manager.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Both claims are required. Without the audience check any
                # GitHub workflow anywhere could present a token; without the
                # exact subject, any repository could. The subject is pinned to
                # one repository AND one environment, so a pull request from a
                # fork - which cannot reach a protected environment - cannot
                # assume this role even from a branch of this repository.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !If
                  - HasSubjectPrefix
                  - !Sub ${GitHubSubjectPrefix}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # One document, one instance. Both ARNs belong in one statement:
              # SendCommand authorizes the document and the target together.
              - Sid: RunTheDeployDocumentOnThisInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${DeployDocument}
              # Read-only, and the one call the workflow makes to find out
              # whether the deploy succeeded. SSM defines no resource types for
              # it, so "*" is the narrowest form IAM accepts.
              - Sid: ReadBackTheCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-eip

  # Associated separately so the address is allocated before the instance
  # launches and survives stopping or replacing it - the DNS record you point
  # at it stays valid.
  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # Serves HTTPS on a free *.cloudfront.net domain, which is the only way to get
  # a browser-trusted certificate without owning a domain. Note this is not
  # end-to-end encryption: the viewer-to-CloudFront hop is HTTPS, but
  # CloudFront-to-origin is plain HTTP, since the origin has no certificate to
  # present. A real domain with Caddy issuing its own certificate is strictly
  # better; this exists for when there is no domain to use.
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} - System Design Interview Platform
        Aliases: !If [UseCloudFrontDomain, [!Ref CloudFrontDomainName], !Ref AWS::NoValue]
        # PriceClass_100 is the cheapest tier: North America and Europe edges.
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          # CloudFront rejects a bare IP address as an origin, so address the
          # instance by the public DNS name that AWS derives from its Elastic IP.
          - Id: instance
            DomainName: !Sub
              - ec2-${Dashed}.${Suffix}
              - Dashed: !Join ["-", !Split [".", !Ref ElasticIp]]
                Suffix: !If
                  - IsUsEast1
                  - compute-1.amazonaws.com
                  - !Sub ${AWS::Region}.compute.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: instance
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # The app is entirely dynamic and authenticated, so nothing may be
          # cached and every header, cookie and query string has to reach the
          # origin - including the Upgrade and Sec-WebSocket-* headers that make
          # the realtime canvas work.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader, so the origin receives its own hostname
          # rather than the CloudFront one.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
        ViewerCertificate: !If
          - UseCloudFrontDomain
          - AcmCertificateArn: !Ref CloudFrontCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  # Alias records share CloudFront's fixed hosted zone ID in every region -
  # Z2FDTNDATAQYW2 is not specific to this account or distribution.
  CloudFrontAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateCloudFrontAliasRecord
    Properties:
      HostedZoneId: !Ref CloudFrontHostedZoneId
      Name: !Ref CloudFrontDomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Shell tracing is deliberately off: this script generates the JWT and
          # database secrets, and -x would copy them into the cloud-init log.
          set -euo pipefail
          exec > >(tee -a /var/log/sdip-bootstrap.log) 2>&1

          echo "=== packages ==="
          dnf install -y docker git

          echo "=== docker cli plugins ==="
          # Amazon Linux 2023 ships neither plugin, and current Compose refuses
          # to build an image without buildx 0.17+. The two projects name their
          # release assets differently: compose uses uname's aarch64/x86_64,
          # buildx uses arm64/amd64.
          case "$(uname -m)" in
            aarch64) COMPOSE_ARCH=aarch64; BUILDX_ARCH=arm64 ;;
            x86_64)  COMPOSE_ARCH=x86_64;  BUILDX_ARCH=amd64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install -d /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${!COMPOSE_ARCH}" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose

          # buildx embeds its version in the asset name, so unlike compose there
          # is no latest/download shortcut. Pinned rather than resolved from the
          # GitHub API, which keeps the bootstrap deterministic and offline of
          # rate limits.
          curl -fsSL "https://github.com/docker/buildx/releases/download/${BuildxVersion}/buildx-${BuildxVersion}.linux-${!BUILDX_ARCH}" \
            -o /usr/local/lib/docker/cli-plugins/docker-buildx

          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose \
                     /usr/local/lib/docker/cli-plugins/docker-buildx

          systemctl enable --now docker
          usermod -aG docker ec2-user

          echo "=== swap ==="
          # The frontend bundle is built on this box and the Node build can spike
          # past the smaller instance types' RAM and get OOM-killed.
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo "/swapfile none swap sw 0 0" >> /etc/fstab
          fi

          echo "=== source ==="
          if [ ! -d /opt/sdip/.git ]; then
            git clone --branch "${RepoRef}" "${RepoUrl}" /opt/sdip
          fi
          cd /opt/sdip

          echo "=== environment ==="
          # An empty DomainName means nothing here terminates TLS, which is the
          # mode used when CloudFront does it instead. Caddy reads a bare :80 as
          # "serve plain HTTP for any Host", so it answers CloudFront regardless
          # of which Host header reaches the origin.
          SITE_ADDRESS="${DomainName}"
          if [ -z "${!SITE_ADDRESS}" ]; then SITE_ADDRESS=":80"; fi
          echo "site address: ${!SITE_ADDRESS}"

          # Secrets are generated here and never leave the instance: they are
          # not stack parameters, so they stay out of the template, the stack
          # events, and the instance metadata.
          if [ ! -f /opt/sdip/.env ]; then
            umask 077
            cat > /opt/sdip/.env <<'ENVEOF'
          POSTGRES_USER=sdip
          POSTGRES_DB=sdip
          ENVEOF
            echo "SDIP_DOMAIN=${!SITE_ADDRESS}" >> /opt/sdip/.env
            echo "SDIP_TLS_EMAIL=${TlsEmail}" >> /opt/sdip/.env
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" >> /opt/sdip/.env
            echo "SDIP_JWT_SECRET=$(openssl rand -hex 32)" >> /opt/sdip/.env
          fi

          echo "=== build and start ==="
          # Containers carry restart: unless-stopped and docker is enabled, so
          # the stack comes back on its own after a reboot.
          docker compose -f docker-compose.prod.yaml up -d --build

          echo "=== bootstrap complete ==="

Outputs:
  ElasticIp:
    Description: Point your domain's DNS A record at this address.
    Value: !Ref ElasticIp

  Url:
    Condition: HasDomain
    Description: Live once DNS resolves and Caddy has issued the certificate.
    Value: !Sub https://${DomainName}

  CloudFrontUrl:
    Condition: UseCloudFront
    Description: >-
      HTTPS on CloudFront's own certificate, with no domain required. Takes a few
      minutes to become available after the distribution is created.
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  CloudFrontDomainUrl:
    Condition: UseCloudFrontDomain
    Description: >-
      HTTPS on your own domain via CloudFront. Set as the SDIP_PUBLIC_URL
      repository variable.
    Value: !Sub https://${CloudFrontDomainName}

  InstanceId:
    Value: !Ref Instance

  SessionManagerCommand:
    Description: Open a shell on the instance without SSH.
    Value: !Sub aws ssm start-session --target ${Instance}

  GitHubDeployRoleArn:
    Condition: HasGitHubRepo
    Description: Set as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt GitHubDeployRole.Arn

  GitHubDeployDocument:
    Condition: HasGitHubRepo
    Description: Set as the SDIP_DEPLOY_DOCUMENT repository variable.
    Value: !Ref DeployDocument

  GitHubVariablesCommand:
    Condition: HasGitHubRepo
    Description: >-
      Run this once to point the workflow at this stack. Setting
      SDIP_INSTANCE_ID is what enables the deploy job.
    Value: !Sub >-
      gh variable set AWS_REGION --body ${AWS::Region} &&
      gh variable set AWS_DEPLOY_ROLE_ARN --body ${GitHubDeployRole.Arn} &&
      gh variable set SDIP_DEPLOY_DOCUMENT --body ${DeployDocument} &&
      gh variable set SDIP_INSTANCE_ID --body ${Instance}

  BootstrapLog:
    Description: >-
      Read this first if the site does not come up - the stack reports success
