[project]
name = "system-design-interview-backend"
version = "0.1.0"
description = "FastAPI backend for the System Design Interview Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic[email]>=2.11.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
