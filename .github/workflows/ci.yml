name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete. main is
# excluded so a deploy is never cancelled halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      # The suite defaults to SQLite; this is the second run's target, so the
      # PostgreSQL-only paths (JSONB columns, advisory locks) are covered too.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdip
          POSTGRES_PASSWORD: sdip
          POSTGRES_DB: sdip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdip -d sdip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --project backend --frozen

      - name: Run tests (SQLite)
        run: uv run --project backend --frozen pytest backend/tests

      - name: Run tests (PostgreSQL)
        env:
          SDIP_TEST_DATABASE_URL: postgresql://sdip:sdip@localhost:5432/sdip_test
        run: uv run --project backend --frozen pytest backend/tests

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The same build the Dockerfile runs, so a broken bundle fails here
      # rather than several minutes into the image build below.
      - name: Build
        run: npm run build

  stack:
    name: Integration and E2E tests
    # Nothing here can pass while the unit suites are red, and the image build
    # is the expensive part of the pipeline - so let them go first.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      APP_PORT: "8100"
      SDIP_JWT_SECRET: ci-secret-not-used-outside-this-runner
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: integration/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build the stack
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait

      # Integration first: it fails in seconds with a clear API-level message,
      # while an E2E failure needs the trace to explain itself.
      - name: Integration tests
        run: uv run --project integration --frozen pytest integration/tests

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: e2e
        env:
          # The stack is already up and stays under this job's control, so
          # Playwright must not try to start a second one.
          E2E_EXTERNAL_STACK: "1"
        run: npm test

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy-dev:
    name: Deploy to dev
    needs: [stack]
    # Skipped entirely until the deployment variables are configured - see
    # "Continuous deployment" in README.md.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.SDIP_INSTANCE_ID != ''
    # arm64, matching the t4g (Graviton) instances - a native build here, no
    # QEMU cross-build, and the image runs on exactly the CPU it was built on.
    runs-on: ubuntu-24.04-arm
    environment: dev
    permissions:
      id-token: write # for the OIDC token exchanged for the AWS role
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # `dev` is a moving pointer to whatever image is currently running in
      # dev - promote.yml reads it to find out what to ship to production,
      # so it needs no GitHub-side state of its own. The dated tag is the
      # immutable, auditable record of every build.
      - name: Build and push the app image
        id: image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ vars.SDIP_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          docker build -t "$REPOSITORY:$tag" -t "$REPOSITORY:dev" .
          docker push "$REPOSITORY:$tag"
          docker push "$REPOSITORY:dev"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The steps themselves live in the SSM document the CloudFormation stack
      # defines, not here: this role may run that one document against that one
      # instance and nothing else, so it never holds shell access. The commit
      # SHA and image tag are the only inputs, and the document's
      # allowedPattern rejects anything that is not well-formed.
      - name: Roll the instance forward to ${{ github.sha }}
        env:
          INSTANCE_ID: ${{ vars.SDIP_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "${{ vars.SDIP_DEPLOY_DOCUMENT }}" \
            --comment "Deploy ${GITHUB_SHA::7} ($IMAGE_TAG)" \
            --timeout-seconds 1800 \
            --parameters "{\"commit\":[\"$GITHUB_SHA\"],\"imageTag\":[\"$IMAGE_TAG\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=0
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" || status=$?

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [ "$status" -ne 0 ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text >&2
            exit 1
          fi

      - name: Smoke-test the deployment
        if: vars.SDIP_PUBLIC_URL != ''
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${{ vars.SDIP_PUBLIC_URL }}/health" | grep -q '"ok"'; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "the deployment did not report healthy" >&2
          exit 1
