name: Promote dev to production

# Deliberately workflow_dispatch only - there is no automatic path to
# production. A human decides when dev is good enough to ship, and triggers
# this by hand from the Actions tab.
on:
  workflow_dispatch:

# Never run two promotions at once, and never cancel one partway through a
# live rollout on the production instance.
concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    name: Deploy dev's current image to production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # for the OIDC token exchanged for the AWS role
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # `dev` is the moving tag deploy-dev leaves on whatever image it last
      # pushed - production never builds, it only ever promotes a build dev
      # already ran. The dated tag sharing that same image is where the
      # commit sha comes from. No GitHub-side state involved, so this is
      # always exactly what dev is running right now, not what CI last
      # thought it deployed.
      - name: Resolve what dev is currently running
        id: dev
        run: |
          set -euo pipefail
          tags=$(aws ecr describe-images \
            --repository-name "${{ vars.SDIP_ECR_REPOSITORY }}" \
            --image-ids imageTag=dev \
            --query 'imageDetails[0].imageTags' --output text)

          image_tag=""
          for t in $tags; do
            if [[ "$t" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$ ]]; then
              image_tag="$t"
              break
            fi
          done
          if [ -z "$image_tag" ]; then
            echo "no dated version tag alongside 'dev' - has dev deployed at least once?" >&2
            exit 1
          fi

          commit="${image_tag##*-}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Promoting $image_tag (commit $commit, currently running in dev) to production"

      # Same SSM document mechanism as dev: this role may run only the
      # production stack's <stack>-deploy document against its own instance,
      # so promoting still can't do anything but check out this one commit
      # and pull this one image - see README "Continuous deployment". This
      # role has no ECR push permission at all; production only ever pulls.
      - name: Roll production forward to ${{ steps.dev.outputs.image_tag }}
        env:
          INSTANCE_ID: ${{ vars.SDIP_INSTANCE_ID }}
          COMMIT: ${{ steps.dev.outputs.commit }}
          IMAGE_TAG: ${{ steps.dev.outputs.image_tag }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "${{ vars.SDIP_DEPLOY_DOCUMENT }}" \
            --comment "Promote $IMAGE_TAG from dev" \
            --timeout-seconds 1800 \
            --parameters "{\"commit\":[\"$COMMIT\"],\"imageTag\":[\"$IMAGE_TAG\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=0
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" || status=$?

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [ "$status" -ne 0 ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text >&2
            exit 1
          fi

      - name: Smoke-test the deployment
        if: vars.SDIP_PUBLIC_URL != ''
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${{ vars.SDIP_PUBLIC_URL }}/health" | grep -q '"ok"'; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "the deployment did not report healthy" >&2
          exit 1
