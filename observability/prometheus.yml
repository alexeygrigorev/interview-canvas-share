global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The collector's own operational metrics (export failures, queue depth,
  # etc.) — separate from the app metrics it forwards via remote_write above.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
