receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus's remote-write receiver, so the collector pushes metrics
  # rather than Prometheus having to know where to scrape them from.
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    # Off by default in this exporter — without it, resource attributes like
    # deployment.environment and service.version never become labels, only
    # job/instance (from service.name/service.instance.id) do. This is what
    # lets one shared stack tell dev and production metrics apart.
    resource_to_telemetry_conversion:
      enabled: true

  # Loki's native OTLP ingestion endpoint (Loki 3.x) — appends /v1/logs.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
